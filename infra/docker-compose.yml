services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo/healthcheck.js:/healthcheck.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --file /healthcheck.js"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    ports:
      - "1883:1883"
    environment:
      MOSQUITTO_DYNSEC_PASSWORD: ${MQTT_ADMIN_PASSWORD:?MQTT_ADMIN_PASSWORD must be set in .env}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - mosquitto_data:/mosquitto/data
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_ctrl -h 127.0.0.1 -u admin -P \"$${MOSQUITTO_DYNSEC_PASSWORD}\" dynsec listRoles >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  django:
    build: ../backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DEVICE_JWT_SECRET: ${DEVICE_JWT_SECRET:?DEVICE_JWT_SECRET must be set in .env}
      DEVICE_JWT_TTL_SECONDS: ${DEVICE_JWT_TTL_SECONDS:-3600}
      DEVICE_CHALLENGE_TTL_SECONDS: ${DEVICE_CHALLENGE_TTL_SECONDS:-60}
      MONGO_HOST: "mongodb://mongo:27017/?replicaSet=rs0"
      MONGO_DB_NAME: "ai_talking_toy"
      MQTT_HOST: "mosquitto"
      MQTT_PORT: "1883"
      MQTT_BRIDGE_USERNAME: "django-service"
      MQTT_BRIDGE_PASSWORD: ${MQTT_BRIDGE_PASSWORD:?MQTT_BRIDGE_PASSWORD must be set in .env}
      MQTT_ADMIN_USERNAME: "admin"
      MQTT_ADMIN_PASSWORD: ${MQTT_ADMIN_PASSWORD:?MQTT_ADMIN_PASSWORD must be set in .env}
      # Phase 11: the only Django -> AI service call path (Section 15/25).
      AI_SERVICE_URL: "http://ai-service:8000"
      AI_SERVICE_INTERNAL_TOKEN: ${AI_SERVICE_INTERNAL_TOKEN:?AI_SERVICE_INTERNAL_TOKEN must be set in .env}
      AI_SERVICE_TIMEOUT_SECONDS: ${AI_SERVICE_TIMEOUT_SECONDS:-30}
      
      LOCAL_UI_TEST_BYPASS: ${LOCAL_UI_TEST_BYPASS:-false}
      LOCAL_UI_TEST_USER_EMAIL: ${LOCAL_UI_TEST_USER_EMAIL:-}
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      # ai-service is intentionally NOT a dependency: an AI-service outage
      # must never keep Django from starting (Phase 11 fallback handles it).
    command: ["sh", "-c", "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"]

  ai-service:
    build:
      context: ../ai_service
      dockerfile: Dockerfile
    environment:
      AI_SERVICE_INTERNAL_TOKEN: ${AI_SERVICE_INTERNAL_TOKEN:?AI_SERVICE_INTERNAL_TOKEN must be set in .env}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  mongo_data:
  mosquitto_data:
