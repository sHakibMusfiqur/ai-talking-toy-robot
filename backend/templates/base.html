{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  {% if request.local_ui_active %}<meta name="local-ui-bypass" content="1">{% endif %}
  <title>{% block title %}Control Panel{% endblock %} · AI Talking Toy Robot</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v={{ asset_version }}">
</head>
<body class="min-h-screen font-sans">
{% block body %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
