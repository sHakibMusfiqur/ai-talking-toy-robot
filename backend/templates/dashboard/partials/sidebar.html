<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">RoboPanel</span>
  </div>
  <nav class="sidebar-nav" aria-label="Main navigation">
    <a href="{% url 'dashboard' %}"
       class="nav-link{% if active_nav == 'overview' %} is-active{% endif %}"
       {% if active_nav == 'overview' %}aria-current="page"{% endif %}>Overview</a>
    <a href="{% url 'dashboard' %}#robots"
       class="nav-link{% if active_nav == 'robots' %} is-active{% endif %}"
       {% if active_nav == 'robots' %}aria-current="page"{% endif %}>Robots</a>
  </nav>
  <div class="sidebar-account">
    <p class="account-label">Account</p>
    <p class="account-email" title="{{ user_email }}">{{ user_email }}</p>
    <button type="button" class="btn btn-ghost btn-small" data-logout>Sign out</button>
  </div>
</aside>
