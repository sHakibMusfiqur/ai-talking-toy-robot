<aside id="sidebar" class="sidebar-panel" aria-label="Main navigation">
  <div class="flex items-center gap-3 px-2">
    <span class="logo-tile" aria-hidden="true">
      <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4.5"/><circle cx="12" cy="12" r="3.2"/><path d="M12 4v2.6M12 17.4V20"/></svg>
    </span>
    <span class="text-lg font-bold tracking-wide">Robo<span class="text-gold">Panel</span></span>
  </div>
  <nav class="flex flex-1 flex-col gap-1.5" aria-label="Panel sections">
    <a href="{% url 'dashboard' %}"
       class="nav-item{% if active_nav == 'overview' %} nav-active{% endif %}"
       {% if active_nav == 'overview' %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>
      Dashboard</a>
    {% if controller_href %}
    <a href="{{ controller_href }}"
    {% else %}
    <a href="{% url 'dashboard' %}#robots"
    {% endif %}
       class="nav-item{% if active_nav == 'controller' %} nav-active{% endif %}"
       {% if active_nav == 'controller' %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="11" rx="5.5"/><path d="M7 12.5h3M8.5 11v3M15.5 11.5h.01M17.5 13.5h.01"/></svg>
      Robot Controller</a>
    <a href="{% url 'dashboard' %}#robots"
       class="nav-item{% if active_nav == 'robots' %} nav-active{% endif %}"
       {% if active_nav == 'robots' %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
      Robot List</a>

    <!-- Future sections: visible but disabled (no routes yet). -->
    <span class="nav-soon" aria-disabled="true">
      <svg viewBox="0 0 24 24" class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Conversations
      <span class="soon-badge">Soon</span>
    </span>
    <span class="nav-soon" aria-disabled="true">
      <svg viewBox="0 0 24 24" class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
      Events
      <span class="soon-badge">Soon</span>
    </span>
    <span class="nav-soon" aria-disabled="true">
      <svg viewBox="0 0 24 24" class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M5.9 5.9l1.6 1.6M16.5 16.5l1.6 1.6M18.1 5.9l-1.6 1.6M7.5 16.5l-1.6 1.6"/></svg>
      Settings
      <span class="soon-badge">Soon</span>
    </span>
  </nav>
  <div class="border-t border-line pt-4">
    <p class="px-2 text-[11px] uppercase tracking-[0.15em] text-faint">Account</p>
    <p class="mt-1 break-all px-2 text-sm text-muted" title="{{ user_email }}">{{ user_email }}</p>
  </div>
</aside>
